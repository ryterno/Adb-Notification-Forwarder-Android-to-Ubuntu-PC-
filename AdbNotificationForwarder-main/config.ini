[config]

; Adresse et port de l'émulateur ou de l'appareil Android
address = 127.0.0.1
port = 5555

; Intervalle de vérification des notifications en secondes
interval = 10

; --- OPTIONS DES NOUVELLES FONCTIONNALITÉS ---

; Mots-clés pour ignorer/passer des messages (séparés par des virgules)
skip_keywords = charge, chargement par câble, connecté via usb, transfert de fichiers, pub, spam

; Téléchargement automatique des icônes via SerpApi (true/false)
fetch_icons = true
serpapi_key = your_key

; Reconnexion ADB automatique en cas de coupure (true/false)
auto_reconnect = true

; Ouvrir l'application sur le téléphone au clic sur la notification (true/false)
open_app_on_click = true

; ---------------------------------------------

; Filtrer par package (laisser commenté pour toutes les applications)
; packages = com.google.android.apps.messaging, com.whatsapp

; Emplacement des clés ADB
; adbprivkey = 
; adbpubkey =
